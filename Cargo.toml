[package]
name = "anytype-task-exporter"
version = "0.1.0"
edition = "2024"

[dependencies]
anytype = "=0.5.0"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13"
http = "1.5.0"
httpdate = "1.0.3"
humantime = "2.3.0"
humantime-serde = "1.1.1"
icalendar = "0.17.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rrule = "0.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "rt"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
web-push = { version = "0.11", default-features = false, features = ["hyper-client"] }

[dev-dependencies]
anytype = { version = "=0.5.0", features = ["test-fixtures", "scripted-http-fixture"] }
futures = "0.3.34"
http-body-util = "0.1.5"
ical = "0.11.0"
tempfile = "3.27.0"
reqwest = { version = "0.13.4", default-features = false }
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
