# anytype-caldav — example configuration.
# The API key is NOT stored here; it is read from the ANYTYPE_API_KEY
# environment variable.
#
# Every value below can also be set by an environment variable, which wins
# over this file: ANYTYPE_CALDAV__<SECTION>__<KEY>, for example
# ANYTYPE_CALDAV__CALENDAR__TIMEZONE=Europe/Berlin. Booleans, numbers and
# arrays are written as in TOML; anything else is taken as a string. Without
# --config the whole configuration comes from the environment. The three
# required property selectors default to the keys `init` creates.

[anytype]
url = "http://127.0.0.1:31009"
# A 59-character id starting with "bafyrei", optionally with a ".<hash>" suffix.
# Optional: left out, the only space the account is a member of is served.
space_id = "bafyrei...REPLACE..."
# Type whose objects become VTODOs. Override if your space uses a custom
# or localized task type.
type_key = "task"
# A refresh that would exceed this fails instead of running unbounded.
max_objects = 5000

[properties]
# Each selector is "key:<stable-key>" or "id:<opaque-id>".
# If a selector matches nothing, the refresh fails and every property the
# type actually offers is logged, which is how you discover the right values.
scheduled = "key:scheduled"
deadline  = "key:due_date"
done      = "key:done"
# Optional. A select/multi-select property whose option *names* are durations
# ("15m", "2h", "1d"): each chosen option becomes one reminder for that task.
# Anytype snake_cases option keys, so the name is what gets parsed. Tasks that
# leave it empty use reminders.lead_time below.
# reminder = "id:<opaque-id>"
# Optional. A select/multi-select whose option names become CATEGORIES, one
# line per tag. Calino colours tasks by category name.
# tags = "id:<opaque-id>"
# Optional. An `objects` property holding the people a task is assigned to.
# Configuring it adds a calendar per person beside the flat one, named from the
# space's own `profile` objects; without it every task is served from the flat
# calendar only.
# assignee = "key:assignee"

[calendar]
timezone = "Europe/Saratov"
name = "Anytype Tasks"
# Timezone in which a value is tested for midnight to classify it as all-day.
# Defaults to `timezone`. Set to "UTC" if Anytype turns out to persist
# date-only values as midnight UTC.
date_only_timezone = "Europe/Saratov"
# Language of what a person reads: notifications, calendar names, the deadline
# line in a description. "en" (default) or "ru".
# language = "en"

[server]
listen = "127.0.0.1:8080"
# Path the feed is served at. The feed is unauthenticated by design, so on any
# bind reachable from outside this machine an unguessable path is what protects
# it — the same approach Google, Apple and Fastmail use for calendar feeds.
# Generate one with:  openssl rand -hex 16
# feed_path = "/f/REPLACE-WITH-32-RANDOM-HEX/todos.ics"
request_timeout = "10s"
# Requests inside this window are served from cache without contacting Anytype.
min_refresh_interval = "30s"
# Origins allowed to read the feed from a browser. Required for Calino.
# An empty list emits no CORS headers; "*" is refused.
allowed_origins = ["https://calino.io"]

[reminders]
# A VALARM on each open task. Only data: a client must be running to fire it.
enabled = true
# How long before a timed deadline the alarm fires.
lead_time = "30m"
# All-day tasks start at midnight, so they alarm at this local time instead.
all_day_time = "09:00"

# Optional server-side Web Push delivery. On iOS the site must first be added
# to the Home Screen and subscribed from there.
# [push]
# enabled = true
# Keep this key stable: replacing it invalidates existing subscriptions.
# Made on the first start when the file does not exist.
# private_key_file = "~/.config/vapid_private.pem"
# Contains subscription encryption keys and handled reminder identities.
# Keep it private and back it up together with the VAPID key.
# state_file = "~/.local/share/anytype-caldav/state.sqlite3"
# poll_interval = "30s"
# Reminders missed during shorter downtime are sent late; older ones are skipped.
# late_window = "1h"
# The calendar app a tapped notification opens. When set, pushes also carry a
# Declarative Web Push envelope, which Safari on iOS 18.4+ shows without a
# service worker. The fork of Calino subscribes to them from its settings.
# app_url = "https://calendar.example/"

# Generator of recurring tasks and events. A `recurring_task` or
# `recurring_event` object holds the rule and the start; the task or event for
# the next occurrence is created on the day of the previous one. An event is
# created from the event template named as its series, or from the event
# type's only template.
# Needs push.state_file, which remembers what was created.
# [series]
# enabled = true
# events = true
# poll_interval = "5m"
# How far ahead occurrences are made. Unset, only the next one is.
# horizon = "31d"

# CalDAV facade under /dav/, for a calendar app such as Calino. The password
# comes from CALDAV_PASSWORD, next to the Anytype API key.
# With ACCOUNTS_SECRET set beside it and `properties.assignee` configured, every
# person of the space also has an account of their own, derived from that
# secret; `exporter users` prints them.
# [caldav]
# enabled = true
# username = "anytype"
# Accept edits from the client and write them to Anytype. Off by default, so a
# deploy never makes the calendar editable by itself.
# writable = true
# Serve objects of type `event` as a second collection, events/.
# events = true
# Serve events inside the task calendar instead of events/, so the space shows
# as one calendar. Only the flat calendar is affected: with tasks split by
# assignee, events stay in events/. Needs events = true.
# events_in_tasks = true
# What the task calendar and the events calendar are called. A name set in the
# calendar app replaces these for that login only. Calendars per assignee take
# the person's name from the space.
# tasks_name = "Anytype"
# events_name = "События"
# Store the client's own settings documents, outside Anytype. Needs
# push.state_file, which holds the database they are kept in.
# settings = true
