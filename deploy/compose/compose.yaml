# anytype-caldav with a headless Anytype of its own and Caddy for TLS.
#
#   cp env.example .env     # fill it in
#   docker compose up -d
#
# Every step of the setup can run again without harm, so after changing .env
# run `docker compose up -d` again.
services:
  anytype:
    # The CLI's image with socat, which relays Anytype's gRPC port (see
    # anytype.sh).
    build:
      dockerfile_inline: |
        FROM ghcr.io/anyproto/anytype-cli:${ANYTYPE_CLI_VERSION:-v0.3.7}
        RUN apk add --no-cache socat
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/setup/anytype.sh"]
    environment:
      # The API answers only requests addressed to localhost unless the name
      # it is reached by is allowed; the server reaches it as anytype:31012.
      # Nothing outside the kit's network can reach the port.
      ANYTYPE_API_ALLOWED_HOSTS: anytype:31012
      ANYTYPE_INVITE_LINK: ${ANYTYPE_INVITE_LINK:-}
      ANYTYPE_ACCOUNT_KEY: ${ANYTYPE_ACCOUNT_KEY:-}
    volumes:
      - ./anytype.sh:/setup/anytype.sh:ro
      - ./network:/setup/network:ro
      - anytype-data:/root/.anytype
      - anytype-config:/root/.config/anytype
      - keys:/shared

  server:
    # The published image; `docker compose up --build` builds it from this
    # checkout instead.
    image: ghcr.io/nrydanov/anytype-caldav:${ANYTYPE_CALDAV_VERSION:-0.1.0}
    build: ../..
    restart: unless-stopped
    depends_on: [anytype]
    # Waits for what the anytype service hands over, prepares the space and
    # serves (see server.sh).
    entrypoint: ["/bin/sh", "/setup/server.sh"]
    command: []
    env_file: .env
    environment:
      ANYTYPE_API_KEY_FILE: /shared/api-key
      ANYTYPE_SESSION_TOKEN_FILE: /shared/session-token
      ANYTYPE_CALDAV__ANYTYPE__URL: http://anytype:31012
      ANYTYPE_CALDAV__ANYTYPE__GRPC_URL: http://anytype:31020
      ANYTYPE_CALDAV__SERVER__LISTEN: 0.0.0.0:8080
      ANYTYPE_CALDAV__CALENDAR__TIMEZONE: ${ANYTYPE_CALDAV__CALENDAR__TIMEZONE:?set ANYTYPE_CALDAV__CALENDAR__TIMEZONE in .env}
      # Everything init prepares is used: the reminder and tag properties,
      # events and recurring series. .env can turn any of it off.
      ANYTYPE_CALDAV__PROPERTIES__REMINDER: ${ANYTYPE_CALDAV__PROPERTIES__REMINDER:-key:reminder_lead}
      ANYTYPE_CALDAV__PROPERTIES__TAGS: ${ANYTYPE_CALDAV__PROPERTIES__TAGS:-key:tag}
      ANYTYPE_CALDAV__CALDAV__ENABLED: "true"
      ANYTYPE_CALDAV__CALDAV__WRITABLE: "true"
      ANYTYPE_CALDAV__CALDAV__EVENTS: ${ANYTYPE_CALDAV__CALDAV__EVENTS:-true}
      ANYTYPE_CALDAV__SERIES__ENABLED: ${ANYTYPE_CALDAV__SERIES__ENABLED:-true}
      ANYTYPE_CALDAV__SERIES__EVENTS: ${ANYTYPE_CALDAV__SERIES__EVENTS:-true}
      ANYTYPE_CALDAV__PUSH__ENABLED: "true"
      ANYTYPE_CALDAV__PUSH__PRIVATE_KEY_FILE: /data/vapid.pem
      ANYTYPE_CALDAV__PUSH__STATE_FILE: /data/state.sqlite3
    volumes:
      - ./server.sh:/setup/server.sh:ro
      - keys:/shared:ro
      - state:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${ANYTYPE_CALDAV_DOMAIN:?set ANYTYPE_CALDAV_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  anytype-data:
  anytype-config:
  keys:
  state:
  caddy:
